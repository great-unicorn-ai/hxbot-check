# HXBot: can the Computer Use driver press the switch of one app's row in Privacy & Security?
# On macos-15 and macos-26, for Screen Recording and for Accessibility: find the row by its app name,
# press its switch through the driver, check that only that switch changed and that System Settings
# asks for a password, then press Cancel and check that the switch went back.
# Results go to the branch main-results, folder grant/<run>/.
name: Mac driver grant

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mac-driver-grant.yml
      - probe/driver-grant.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hxbot-driver-grant
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.machine }}
    runs-on: ${{ matrix.machine }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        machine: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Get the Computer Use driver
        shell: bash
        run: |
          set -euo pipefail
          asset=cua-driver-rs-0.34.0-darwin-universal-binary.tar.gz
          archive="$RUNNER_TEMP/$asset"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/trycua/cua/releases/download/cua-driver-rs-v0.34.0/$asset"
          [ "$(shasum -a 256 < "$archive" | cut -d' ' -f1)" = 940dc008e0f7c5d217d14c0f247d1ebab91b1bac965f4a649d19e8c789bdfd81 ] || { echo "The driver archive has the wrong checksum."; exit 1; }
          mkdir -p "$RUNNER_TEMP/driver"
          (cd "$RUNNER_TEMP/driver" && tar -xzf -) < "$archive"
          found="$(find "$RUNNER_TEMP/driver" -type f -name cua-driver | head -1)"
          [ -n "$found" ] || { echo "The driver archive has no cua-driver."; exit 1; }
          [ "$(shasum -a 256 < "$found" | cut -d' ' -f1)" = 47fa8722003066246ee8a828d3fe2c769f2194d6cf3ad63ae6f0becdc00d383a ] || { echo "The driver has the wrong checksum."; exit 1; }
          chmod +x "$found"
          echo "DRIVER=$found" >> "$GITHUB_ENV"
      - name: Build the probe from the check's own driver code
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("hx-real-check.mjs", "utf8");
            const cut = src.replace(/\nmain\(\)\.then\([\s\S]*$/u, "\n");
            if (cut === src) { console.error("main() not found"); process.exit(1); }
            fs.writeFileSync(process.argv[1], cut + fs.readFileSync("probe/driver-grant.mjs", "utf8"));
          ' "$RUNNER_TEMP/grant.mjs"
      - name: Screen Recording
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: node "$RUNNER_TEMP/grant.mjs" out/screen "$DRIVER" Privacy_ScreenCapture provisioner
      - name: Close System Settings
        shell: bash
        run: |
          pid="$(node -e 'try { console.log(require(process.argv[1]).pid ?? "") } catch { console.log("") }' "$PWD/out/screen/result.json")"
          if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; fi
          sleep 3
      - name: Accessibility
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: node "$RUNNER_TEMP/grant.mjs" out/accessibility "$DRIVER" Privacy_Accessibility provisioner
      - name: Show the results
        if: always()
        shell: bash
        run: |
          for part in screen accessibility; do
            echo "== $part"
            cat "out/$part/result.json" 2>/dev/null || echo "(no result)"
          done | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grant-${{ matrix.machine }}
          path: out
          if-no-files-found: warn
          retention-days: 14

  keep:
    name: keep the results
    needs: [check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: all
          pattern: grant-*
      - name: Keep the results on a branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p all
          work="$RUNNER_TEMP/results"
          git init -q "$work"
          cp -R all "$RUNNER_TEMP/all"
          cd "$work"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin main-results 2>/dev/null; then git checkout -q -B main-results FETCH_HEAD; else git checkout -q --orphan main-results; fi
          mkdir -p "grant/$GITHUB_RUN_NUMBER"
          cp -R "$RUNNER_TEMP/all/." "grant/$GITHUB_RUN_NUMBER/"
          printf '%s %s\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > latest-grant.txt
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Driver grant results of run $GITHUB_RUN_NUMBER"
          for attempt in 1 2 3; do
            git push -q origin main-results && break
            sleep 5
            git pull -q --rebase origin main-results
          done
