# HXBot: does the Computer Use driver work with Accessibility only (no Screen Recording)?
# On macos-15 and macos-26: take away the Screen Recording grant, show what the system says,
# then run the driver steps of the real check (S1–S7: start, grants, open the editor, read
# the outline, type and save, stop before "delete", stop key).
# Results go to the branch main-results, folder a11y/<run>/.
name: Mac accessibility only

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mac-a11y-only.yml
      - probe/screen-state.swift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hxbot-a11y-only
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.machine }}
    runs-on: ${{ matrix.machine }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        machine: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Get the Computer Use driver
        shell: bash
        run: |
          set -euo pipefail
          asset=cua-driver-rs-0.34.0-darwin-universal-binary.tar.gz
          archive="$RUNNER_TEMP/$asset"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/trycua/cua/releases/download/cua-driver-rs-v0.34.0/$asset"
          [ "$(shasum -a 256 < "$archive" | cut -d' ' -f1)" = 940dc008e0f7c5d217d14c0f247d1ebab91b1bac965f4a649d19e8c789bdfd81 ] || { echo "The driver archive has the wrong checksum."; exit 1; }
          mkdir -p "$RUNNER_TEMP/driver"
          (cd "$RUNNER_TEMP/driver" && tar -xzf -) < "$archive"
          found="$(find "$RUNNER_TEMP/driver" -type f -name cua-driver | head -1)"
          [ -n "$found" ] || { echo "The driver archive has no cua-driver."; exit 1; }
          [ "$(shasum -a 256 < "$found" | cut -d' ' -f1)" = 47fa8722003066246ee8a828d3fe2c769f2194d6cf3ad63ae6f0becdc00d383a ] || { echo "The driver has the wrong checksum."; exit 1; }
          chmod +x "$found"
          echo "DRIVER=$found" >> "$GITHUB_ENV"
      - name: Build the screen state probe
        shell: bash
        run: swiftc -O probe/screen-state.swift -o "$RUNNER_TEMP/screen-state"
      - name: Take away the Screen Recording grant
        shell: bash
        run: |
          set +e
          mkdir -p out
          system="/Library/Application Support/com.apple.TCC/TCC.db"
          user="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          {
            echo "macOS: $(sw_vers -productVersion) ($(sw_vers -buildVersion))"
            echo "SIP: $(csrutil status 2>&1)"
            echo "== before (system)"; sudo sqlite3 "$system" "select client, auth_value from access where service='kTCCServiceScreenCapture'" 2>&1
            echo "== before (user)"; sqlite3 "$user" "select client, auth_value from access where service='kTCCServiceScreenCapture'" 2>&1
            echo "== before (probe)"; "$RUNNER_TEMP/screen-state" 2>&1
            echo "== remove"
            sudo sqlite3 "$system" "delete from access where service='kTCCServiceScreenCapture'"; echo "system delete: $?"
            sqlite3 "$user" "delete from access where service='kTCCServiceScreenCapture'"; echo "user delete: $?"
            sudo tccutil reset ScreenCapture; echo "tccutil reset: $?"
            sleep 3
            echo "== after (system)"; sudo sqlite3 "$system" "select client, auth_value from access where service='kTCCServiceScreenCapture'" 2>&1
            echo "== after (user)"; sqlite3 "$user" "select client, auth_value from access where service='kTCCServiceScreenCapture'" 2>&1
            echo "== after (probe)"; "$RUNNER_TEMP/screen-state" 2>&1
            echo "== accessibility (system)"; sudo sqlite3 "$system" "select client, auth_value from access where service='kTCCServiceAccessibility'" 2>&1
          } | tee out/grants.txt
          exit 0
      - name: Ask the driver for its grants
        shell: bash
        run: |
          set +e
          "$DRIVER" --help 2>&1 | head -40 | tee out/driver-help.txt
          for command in "check_permissions" "check-permissions" "permissions"; do
            echo "== $DRIVER $command" | tee -a out/driver-permissions.txt
            perl -e 'alarm shift; exec @ARGV' 20 "$DRIVER" $command 2>&1 | head -40 | tee -a out/driver-permissions.txt
          done
          exit 0
      - name: Run the driver steps (S1–S7)
        shell: bash
        run: |
          set +e
          node hx-real-check.mjs --out out/steps --machine "${{ matrix.machine }}" --parts steps --driver "$DRIVER"
          echo "check exit: $?" | tee out/steps-exit.txt
          "$RUNNER_TEMP/screen-state" > out/screen-state-end.txt 2>&1
          exit 0
      - name: Show the summary
        if: always()
        shell: bash
        run: |
          { echo '```'; cat out/grants.txt; echo '```'; [ -f out/steps/summary.md ] && cat out/steps/summary.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-${{ matrix.machine }}
          path: out
          if-no-files-found: warn
          retention-days: 14

  keep:
    name: keep the results
    needs: [check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: all
          pattern: a11y-*
      - name: Keep the results on a branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p all
          light="$RUNNER_TEMP/light"
          mkdir -p "$light"
          for folder in all/a11y-*/; do
            [ -d "$folder" ] || continue
            name="$(basename "$folder")"
            mkdir -p "$light/$name"
            for file in grants.txt driver-help.txt driver-permissions.txt steps-exit.txt screen-state-end.txt steps/report.json steps/summary.md steps/log.txt; do
              [ -f "$folder$file" ] && cp "$folder$file" "$light/$name/$(echo "$file" | tr / -)"
            done
          done
          work="$RUNNER_TEMP/results"
          git init -q "$work"
          cd "$work"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin main-results 2>/dev/null; then git checkout -q -B main-results FETCH_HEAD; else git checkout -q --orphan main-results; fi
          mkdir -p "a11y/$GITHUB_RUN_NUMBER"
          cp -R "$light/." "a11y/$GITHUB_RUN_NUMBER/"
          printf '%s %s\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > latest-a11y.txt
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Accessibility only results of run $GITHUB_RUN_NUMBER"
          git push -q origin main-results
